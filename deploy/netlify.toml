[build]
  functions = "netlify/functions"

# SITE_URL and RESEND_FROM are intentionally public (site URL + from-email address)
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL,RESEND_FROM"

# ── Canonical redirect: www → non-www (SEO) ──────────────────────────────────
[[redirects]]
  from = "https://www.nextgenwealthproject.netlify.app/*"
  to = "https://nextgenwealthproject.netlify.app/:splat"
  status = 301
  force = true

# ── Old landing page → current homepage (its feature list is out of date) ──────
[[redirects]]
  from = "/landing.html"
  to = "/"
  status = 301
  force = true

# ── Block non-public paths ────────────────────────────────────────────────────
# The publish dir is this folder, so function sources (incl. lib/re-data.json) and this config
# would otherwise be downloadable as static files. (/.netlify/functions/* is unaffected.)
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404"
  status = 404
  force = true

# ── HTML pages: never cache — users see changes on a normal F5 refresh ─────────
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/landing.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ── Netlify functions: never cache ────────────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Security + CSP headers for everything ────────────────────────────────────
# CSP origins (audited against app.html / index.html / landing.html):
#   scripts : unpkg.com (React 18, Leaflet), cdn.jsdelivr.net (supabase-js), cdn.tailwindcss.com
#   styles  : fonts.googleapis.com, unpkg.com (leaflet.css); Tailwind CDN injects <style> at runtime
#   fonts   : fonts.gstatic.com
#   images  : OSM / MapTiler / Stadia map tiles (see map-config.js), unpkg.com (Leaflet marker icons)
#   connect : Supabase (REST + realtime wss), Overpass API mirrors; prices/crypto/geocoding go via functions
#   manifest: built at runtime as a blob: URL
# 'unsafe-inline' stays in script-src/style-src: the pages rely on large inline <script> blocks and
# inline style attributes. Moving them to files (or nonces/hashes) would allow dropping it.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://unpkg.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://api.maptiler.com https://tiles.stadiamaps.com https://vtxuvmtnqlxidnswnunx.supabase.co; connect-src 'self' https://vtxuvmtnqlxidnswnunx.supabase.co wss://vtxuvmtnqlxidnswnunx.supabase.co https://overpass-api.de https://overpass.private.coffee; frame-src https://docs.google.com; manifest-src 'self' blob: data:; worker-src 'self' blob:; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
